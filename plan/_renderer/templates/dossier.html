<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="@@DESCRIPTION@@">
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#f6f2ea; --paper-2:#efe9dd; --card:#fffdf8;
  --ink:#1b1812; --ink-soft:#4f483c; --ink-faint:#847a68;
  --line:#d8d0bf; --line-strong:#b9ae97;
  --accent:#0d5c46; --accent-soft:#e3ede7;
  --critical:#a82e1f; --critical-bg:#f6e3df;
  --medium:#9a6510; --medium-bg:#f5ead3;
  --minor:#3d5a80; --minor-bg:#e2e9f1;
  --display:'Fraunces',serif; --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  min-width:320px; font-family:var(--sans); line-height:1.62; color:var(--ink);
  background-color:var(--paper);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgb(27 24 18 / .012) 3px,rgb(27 24 18 / .012) 4px),radial-gradient(circle at 85% -5%,rgb(13 92 70 / .08),transparent 42%);
}
button,input,select,textarea { font:inherit; }
button { color:inherit; }
a { color:inherit; }
::selection { color:var(--paper); background:var(--accent); }
:focus-visible { outline:3px solid var(--critical); outline-offset:3px; }
.skip-link { position:fixed; top:12px; left:12px; z-index:50; padding:8px 12px; font:12px var(--mono); color:var(--paper); background:var(--ink); transform:translateY(-180%); }
.skip-link:focus { transform:none; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.sheet { width:min(calc(100% - 56px),1060px); margin:0 auto; padding-bottom:96px; }
.topnav { display:flex; justify-content:space-between; gap:18px; padding:18px 0 14px; border-bottom:1px solid var(--line-strong); font:600 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
.topnav-group { display:flex; flex-wrap:wrap; gap:18px; }
.topnav a { text-decoration-thickness:1px; text-underline-offset:4px; }
.topnav a:hover { color:var(--accent); }
.masthead { position:relative; padding:42px 0 48px; border-bottom:3px solid var(--ink); }
.kicker { display:flex; align-items:center; gap:12px; font:600 12px var(--mono); letter-spacing:.22em; color:var(--accent); text-transform:uppercase; }
.kicker::before { width:36px; height:2px; content:''; background:var(--accent); }
h1 { max-width:15ch; margin-top:20px; font:900 clamp(48px,8vw,86px)/.94 var(--display); letter-spacing:-.025em; }
h1 em { color:var(--accent); font-weight:600; }
.stamp { position:absolute; top:126px; right:4px; padding:7px 13px; font:600 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border:2px solid var(--accent); border-radius:4px; transform:rotate(3.5deg); }
.lede { max-width:690px; margin-top:24px; font:400 clamp(19px,2.2vw,25px)/1.45 var(--display); color:var(--ink-soft); }
.masthead-meta { display:flex; flex-wrap:wrap; margin-top:34px; border-top:1px solid var(--line-strong); }
.masthead-meta div { padding:12px 26px 4px 0; margin-right:26px; border-right:1px solid var(--line); }
.masthead-meta div:last-child { border-right:0; }
.masthead-meta dt { font:400 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
.masthead-meta dd { margin-top:2px; font-size:14.5px; font-weight:600; }
.summary { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr); gap:42px; align-items:start; padding:42px 0 8px; }
.summary-copy { color:var(--ink-soft); }
.summary-copy strong { color:var(--ink); }
.tally { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tally .cell { position:relative; overflow:hidden; padding:14px 14px 11px; background:var(--paper-2); border:1.5px solid var(--ink); border-radius:10px; }
.tally .cell::after { position:absolute; inset:0 0 auto; height:5px; content:''; background:var(--accent); }
.tally .cell.blocker::after { background:var(--critical); }
.tally .cell.material::after { background:var(--medium); }
.tally .cell.watch::after { background:var(--minor); }
.tally .num { font:900 42px/1 var(--display); }
.tally .lbl { margin-top:4px; font:400 10px var(--mono); letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase; }
.section { padding-top:76px; }
.section-head { display:grid; grid-template-columns:150px 1fr; gap:28px; align-items:baseline; padding-bottom:14px; border-bottom:3px solid var(--ink); }
.section-label { font:600 11px var(--mono); letter-spacing:.15em; color:var(--accent); text-transform:uppercase; }
.section h2 { font:800 clamp(30px,4vw,42px)/1.05 var(--display); letter-spacing:-.015em; }
.section-intro { max-width:760px; margin-top:16px; color:var(--ink-soft); }
.eyebrow { display:flex; align-items:center; gap:9px; margin-bottom:12px; font:600 10.5px var(--mono); letter-spacing:.16em; color:var(--accent); text-transform:uppercase; }
.eyebrow::after { height:1px; content:''; background:var(--line); flex:1; }
.badge { display:inline-flex; align-items:center; padding:4px 10px; font:600 10px var(--mono); letter-spacing:.1em; text-transform:uppercase; border-radius:999px; white-space:nowrap; color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent); }
.badge.blocker { color:var(--critical); background:var(--critical-bg); border-color:var(--critical); }
.badge.material { color:var(--medium); background:var(--medium-bg); border-color:var(--medium); }
.badge.watch { color:var(--minor); background:var(--minor-bg); border-color:var(--minor); }
.badge.done { color:var(--accent); background:var(--accent-soft); border-color:var(--accent); }
.evidence-grid,.cards-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:28px; }
.evidence-card,.mini-card { padding:22px; background:var(--card); border:1.5px solid var(--ink); border-radius:12px; box-shadow:4px 4px 0 rgb(27 24 18 / .09); }
.evidence-card h3,.mini-card h3 { font:800 21px/1.15 var(--display); }
.evidence-card p,.mini-card p { margin-top:9px; color:var(--ink-soft); font-size:14px; }
.refs,.meta-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; list-style:none; }
.refs code,.meta-list li { padding:3px 7px; font:500 10.5px var(--mono); color:var(--ink-faint); background:var(--paper-2); border:1px solid var(--line); border-radius:4px; word-break:break-all; }
.decision-list,.thread-list { display:grid; gap:26px; margin-top:30px; }
.decision-card,.thread-card { overflow:hidden; background:var(--card); border:1.5px solid var(--ink); border-radius:14px; box-shadow:6px 6px 0 rgb(27 24 18 / .1); }
.card-head { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:18px 22px; background:var(--paper-2); border-bottom:1px solid var(--line); }
.folio { font:900 32px/1 var(--display); color:transparent; -webkit-text-stroke:1.2px var(--ink); }
.card-head h3 { font:800 22px/1.1 var(--display); }
.card-head-right { display:flex; align-items:center; gap:8px; }
.card-copy { padding:22px; border-bottom:1px solid var(--line); }
.card-copy .question { font:600 17px/1.45 var(--sans); color:var(--ink); }
.card-copy .rationale { margin-top:7px; color:var(--ink-soft); font-size:14px; }
.option-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding:22px; }
.option { position:relative; display:block; min-width:0; padding:17px; cursor:pointer; background:var(--paper); border:1.5px solid var(--line-strong); border-radius:10px; }
.option:has(input:checked) { background:var(--accent-soft); border-color:var(--accent); box-shadow:3px 3px 0 rgb(13 92 70 / .15); }
.option-top { display:flex; align-items:flex-start; gap:10px; }
.option input { flex:0 0 auto; margin-top:4px; accent-color:var(--accent); }
.option-title { font-weight:600; }
.recommended { margin-left:auto; padding:2px 6px; font:600 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:4px; }
.option-summary { margin-top:8px; font-size:13.5px; color:var(--ink-soft); }
.option-meta { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:13px; }
.option-meta div { padding-top:7px; border-top:1px dotted var(--line-strong); }
.option-meta dt { font:500 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
.option-meta dd { margin-top:2px; font:500 11px var(--mono); }
.tradeoffs { margin-top:12px; list-style:none; }
.tradeoffs li { position:relative; padding:5px 0 5px 16px; font-size:12.5px; color:var(--ink-soft); border-top:1px dotted var(--line); }
.tradeoffs li::before { position:absolute; left:1px; color:var(--accent); content:'→'; }
.response { display:grid; grid-template-columns:minmax(190px,.55fr) minmax(0,1.45fr); gap:18px; padding:20px 22px; background:linear-gradient(180deg,transparent,rgb(13 92 70 / .035)); border-top:1px dashed var(--line-strong); }
.field label,.field .field-label { display:block; margin-bottom:6px; font:600 10px var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint); }
select,textarea { width:100%; color:var(--ink); background:var(--card); border:1.5px solid var(--line-strong); border-radius:6px; }
select { min-height:42px; padding:8px 34px 8px 10px; }
textarea { min-height:86px; padding:10px 12px; resize:vertical; line-height:1.45; }
select[aria-invalid='true'],textarea[aria-invalid='true'] { border-color:var(--critical); background:var(--critical-bg); }
.thread-card.blocked { box-shadow:none; border-color:var(--line-strong); }
.thread-card .thread-body { padding:20px 22px; }
.thread-card p { color:var(--ink-soft); }
.blocked-by { margin-top:12px; font:500 11px var(--mono); color:var(--minor); }
.content-stack { display:grid; gap:22px; margin-top:28px; }
.content-stack > * { min-width:0; max-width:100%; }
.visual-block { min-width:0; margin:0; padding:14px; background:var(--card); border:1.5px solid var(--ink); border-radius:12px; box-shadow:6px 6px 0 var(--ink); }
.visual-block img { display:block; width:100%; height:auto; border-radius:8px; border:1px solid var(--rule); background:#0b1020; }
.visual-block figcaption { margin-top:12px; color:var(--ink-soft); font:500 12px/1.5 var(--sans); }
.prose p + p { margin-top:12px; }
.prose p { color:var(--ink-soft); }
:not(pre) > code { overflow-wrap:anywhere; word-break:break-word; }
.list-block,.steps-block,.code-block,.flow-block,.table-wrap,.callout { padding:22px; background:var(--card); border:1.5px solid var(--ink); border-radius:12px; }
.table-wrap { overflow-x:auto; }
.list-block h3 { font:800 20px var(--display); }
.outcomes { margin-top:12px; list-style:none; }
.outcomes li { position:relative; padding:8px 0 8px 22px; font-size:13.5px; color:var(--ink-soft); border-top:1px dotted var(--line-strong); }
.outcomes li::before { position:absolute; left:2px; color:var(--accent); content:'→'; }
ol.steps { list-style:none; counter-reset:step; }
ol.steps li { counter-increment:step; position:relative; padding:0 0 15px 34px; font-size:14px; color:var(--ink-soft); }
ol.steps li::before { content:counter(step); position:absolute; left:0; top:1px; display:grid; place-items:center; width:22px; height:22px; font:600 11px var(--mono); color:var(--ink); background:var(--paper); border:1.5px solid var(--ink); border-radius:50%; }
ol.steps li:not(:last-child)::after { content:''; position:absolute; left:10.5px; top:25px; bottom:1px; width:1.5px; background:var(--line-strong); }
.code-block .code-label { margin-bottom:8px; font:600 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }
pre { overflow:auto; padding:16px; color:var(--paper); background:var(--ink); border-radius:8px; }
pre code { font:12px/1.55 var(--mono); white-space:pre; }
.order-table { width:100%; border-collapse:collapse; font-size:14px; }
.order-table th { padding:10px 14px; text-align:left; font:500 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); border-bottom:2px solid var(--ink); }
.order-table td { padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
.order-table tr:hover td { background:rgb(13 92 70 / .04); }
.flow { display:flex; align-items:stretch; gap:8px; overflow-x:auto; }
.flow-node { min-width:180px; padding:14px; background:var(--paper); border:1.5px solid var(--ink); border-radius:9px; }
.flow-node strong { display:block; }
.flow-node span { display:block; margin-top:4px; font-size:12.5px; color:var(--ink-soft); }
.flow-arrow { display:grid; place-items:center; flex:0 0 24px; color:var(--accent); font-size:22px; }
.callout { border-left:4px solid var(--medium); border-radius:0 10px 10px 0; background:var(--medium-bg); }
.callout.warning { border-color:var(--critical); background:var(--critical-bg); }
.callout.success { border-color:var(--accent); background:var(--accent-soft); }
.callout b { display:block; margin-bottom:4px; font:600 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
.timeline { position:relative; display:grid; gap:0; margin-top:30px; }
.timeline::before { position:absolute; top:15px; bottom:15px; left:23px; width:2px; content:''; background:var(--line-strong); }
.timeline-entry { position:relative; display:grid; grid-template-columns:48px minmax(0,1fr); gap:18px; padding-bottom:24px; }
.timeline-dot { z-index:1; display:grid; place-items:center; width:48px; height:48px; font:600 11px var(--mono); color:var(--accent); background:var(--paper); border:2px solid var(--accent); border-radius:50%; }
.timeline-entry.current .timeline-dot { color:var(--paper); background:var(--accent); }
.timeline-body { padding:16px 18px; background:var(--card); border:1.5px solid var(--ink); border-radius:10px; box-shadow:4px 4px 0 rgb(27 24 18 / .08); }
.timeline-body h3 { font:800 20px var(--display); }
.timeline-body h3 a { text-underline-offset:4px; }
.timeline-meta { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; font:500 10px var(--mono); color:var(--ink-faint); text-transform:uppercase; }
.ledger { margin-top:28px; border-top:2px solid var(--ink); }
.ledger-row { display:grid; grid-template-columns:74px 1.2fr .7fr 1.4fr; gap:14px; padding:11px 4px; border-bottom:1px dotted var(--line-strong); align-items:baseline; }
.ledger-id { font:500 11px var(--mono); color:var(--ink-faint); }
.dispatch { position:sticky; bottom:14px; z-index:20; margin-top:58px; padding:16px; color:var(--paper); background:var(--ink); border:1px solid var(--ink); border-radius:10px; box-shadow:7px 7px 0 rgb(27 24 18 / .18); }
.dispatch-grid { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; }
.progress-label { font:500 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
.progress-label span { color:#b8d5ca; }
.progress-track { height:4px; margin-top:7px; background:rgb(246 242 234 / .2); }
.progress-fill { width:0; height:100%; background:#72b69f; transition:width .16s ease; }
.btn { min-height:42px; padding:8px 13px; font:600 10.5px var(--mono); letter-spacing:.07em; text-transform:uppercase; cursor:pointer; border:1.5px solid var(--paper); border-radius:6px; }
.btn.primary { color:var(--ink); background:var(--paper); }
.btn.primary:hover,.btn.primary[data-state='copied'] { color:var(--paper); background:var(--accent); border-color:var(--accent); }
.btn.ghost { color:var(--paper); background:transparent; }
.btn:disabled { cursor:not-allowed; opacity:.45; }
.validation-hint { margin-top:7px; font-size:12px; color:#dccfba; }
.intent-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.intent { display:flex; gap:8px; align-items:flex-start; padding:12px; cursor:pointer; background:var(--paper-2); border:1.5px solid var(--line-strong); border-radius:8px; }
.intent:has(input:checked) { background:var(--accent-soft); border-color:var(--accent); }
.intent input { margin-top:4px; accent-color:var(--accent); }
.intent b { display:block; font-size:13px; }
.intent small { display:block; margin-top:2px; color:var(--ink-soft); }
.colophon { display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:90px; padding-top:22px; font:400 10.5px var(--mono); letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; border-top:3px solid var(--ink); }
@media (prefers-reduced-motion:no-preference) {
  .masthead,.summary,.section,.colophon { animation:rise .58s cubic-bezier(.2,.7,.2,1) both; }
  .summary { animation-delay:.08s; } .section { animation-delay:.14s; } .colophon { animation-delay:.2s; }
  .btn { transition:color .16s ease,background-color .16s ease,border-color .16s ease,transform .16s ease; }
  .btn:active { transform:translateY(1px); }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
}
@media (max-width:760px) {
  .sheet { width:min(calc(100% - 32px),1060px); }
  h1 { font-size:clamp(45px,14vw,68px); }
  .stamp { position:static; display:inline-block; margin-top:22px; }
  .summary,.section-head,.option-grid,.evidence-grid,.cards-grid,.response { grid-template-columns:1fr; }
  .section { padding-top:62px; }
  .ledger-row { grid-template-columns:64px 1fr; }
  .ledger-row > :nth-child(n+3) { grid-column:2; }
  .dispatch-grid { grid-template-columns:1fr auto; }
  .dispatch-grid .progress { grid-column:1 / -1; }
}
@media (max-width:460px) {
  .topnav { flex-direction:column; }
  .card-head { grid-template-columns:auto 1fr; }
  .card-head-right { grid-column:2; }
  .option-grid,.card-copy,.response,.thread-card .thread-body { padding-left:17px; padding-right:17px; }
  .intent-grid { grid-template-columns:1fr; }
  .dispatch-grid { grid-template-columns:1fr; }
  .btn { width:100%; }
  .colophon { flex-direction:column; }
}
@media print {
  body { background:white; }
  .topnav,.dispatch,.interactive-only { display:none !important; }
  .decision-card,.thread-card,.evidence-card,.mini-card,.timeline-body { box-shadow:none; break-inside:avoid; }
  .stamp { transform:none; }
  .section { break-before:auto; }
}
</style>
</head>

<script id="planning-data" type="application/json">@@DATA_JSON@@</script>
<script>
(function () {
  'use strict';
  var dataEl = document.getElementById('planning-data');
  var data;
  try { data = JSON.parse(dataEl.textContent); } catch (_) { return; }
  var form = document.getElementById('planning-form');
  if (!form) return;

  var ui = data.ui;
  var storageKey = 'planning-dossier:' + data.dossier.id + ':round:' + data.round.number + ':v1';
  var copyButton = document.getElementById('copy-markdown');
  var resetButton = document.getElementById('reset-state');
  var status = document.getElementById('live-status');
  var hint = document.getElementById('validation-hint');
  var progressText = document.getElementById('progress-text');
  var progressFill = document.getElementById('progress-fill');
  var saveTimer;
  var copyTimer;

  function controls() { return Array.prototype.slice.call(form.querySelectorAll('[data-state]')); }

  function snapshot() {
    var state = {};
    controls().forEach(function (el) {
      if (el.type === 'radio') {
        if (el.checked) state[el.name] = el.value;
      } else if (el.type === 'checkbox') {
        if (!Array.isArray(state[el.name])) state[el.name] = [];
        if (el.checked) state[el.name].push(el.value);
      } else {
        state[el.name] = el.value;
      }
    });
    return state;
  }

  function restore() {
    var raw;
    try { raw = localStorage.getItem(storageKey); } catch (_) { return; }
    if (!raw) return;
    var state;
    try { state = JSON.parse(raw); } catch (_) { return; }
    controls().forEach(function (el) {
      var value = state[el.name];
      if (el.type === 'radio') el.checked = value === el.value;
      else if (el.type === 'checkbox') el.checked = Array.isArray(value) && value.indexOf(el.value) !== -1;
      else if (typeof value === 'string') el.value = value;
    });
    status.textContent = ui.restored;
  }

  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(snapshot()));
      status.textContent = ui.saved;
    } catch (_) {
      status.textContent = ui.saveFailed;
    }
  }

  function setInvalid(el, invalid) {
    if (!el) return;
    if (invalid) el.setAttribute('aria-invalid', 'true');
    else el.removeAttribute('aria-invalid');
  }

  function validate(markFields) {
    var state = snapshot();
    var complete = 0;
    var total = 0;
    var errors = [];
    var intent = state.intent || (data.round.kind === 'final' ? 'implement' : '');

    data.round.decisions.forEach(function (decision) {
      total += 1;
      var dispositionName = 'decision.' + decision.id + '.disposition';
      var optionName = 'decision.' + decision.id + '.option';
      var noteName = 'decision.' + decision.id + '.note';
      var disposition = state[dispositionName] || '';
      var selected = state[optionName] || (decision.mode === 'multiple' ? [] : '');
      var note = (state[noteName] || '').trim();
      var selectedCount = Array.isArray(selected) ? selected.length : (selected ? 1 : 0);
      var valid = Boolean(disposition);
      if (disposition === 'decide') valid = selectedCount > 0;
      if (disposition && disposition !== 'decide') valid = note.length > 0;
      if (intent === 'consolidate' && (decision.criticality === 'blocker' || decision.criticality === 'material')) {
        valid = valid && (disposition === 'decide' || disposition === 'discard');
      }
      if (valid) complete += 1;
      else errors.push(decision.id);
      if (markFields) {
        setInvalid(form.elements[dispositionName], !disposition);
        setInvalid(form.elements[noteName], disposition && disposition !== 'decide' && !note);
      }
    });

    data.round.threads.filter(function (thread) { return thread.status === 'open'; }).forEach(function (thread) {
      total += 1;
      var dispositionName = 'thread.' + thread.id + '.disposition';
      var noteName = 'thread.' + thread.id + '.note';
      var disposition = state[dispositionName] || '';
      var note = (state[noteName] || '').trim();
      var valid = Boolean(disposition) && note.length > 0;
      if (intent === 'consolidate' && (thread.criticality === 'blocker' || thread.criticality === 'material')) {
        valid = valid && (disposition === 'resolve' || disposition === 'discard');
      }
      if (valid) complete += 1;
      else errors.push(thread.id);
      if (markFields) {
        setInvalid(form.elements[dispositionName], !disposition);
        setInvalid(form.elements[noteName], !note);
      }
    });

    if (data.round.kind !== 'final' && !intent) errors.push(ui.intentMissing);
    var percentage = total ? Math.round((complete / total) * 100) : 100;
    progressText.textContent = complete + '/' + total;
    progressFill.style.width = percentage + '%';
    copyButton.disabled = errors.length > 0;
    hint.textContent = errors.length ? ui.incomplete + ': ' + errors.join(', ') : ui.ready;
    return { valid: errors.length === 0, state: state, intent: intent };
  }

  function bulletNote(lines, note) {
    if (!note) return;
    note.split(/\r?\n/).forEach(function (line) {
      if (line.trim()) lines.push('  - ' + line.trim());
    });
  }

  function buildMarkdown(result) {
    var path = data.outputDir.replace(/\\/g, '/');
    var roundFile = data.round.file;
    var lines = [];
    if (data.round.kind === 'final') {
      lines.push('# ' + ui.handoffTitle);
      lines.push('');
      lines.push('- Dossier: `' + data.dossier.id + '`');
      lines.push('- Index: `' + path + '/index.html`');
      lines.push('- Final plan: `' + path + '/' + roundFile + '`');
      lines.push('- Source round: `' + String(data.round.number).padStart(2, '0') + '`');
      lines.push('');
      lines.push('## ' + data.round.finalHandoff.title);
      lines.push('');
      lines.push(data.round.finalHandoff.instruction);
      lines.push('');
      lines.push('- ' + ui.startWith + ': ' + data.round.finalHandoff.startWith);
      return lines.join('\n');
    }

    lines.push('# ' + ui.continueTitle);
    lines.push('');
    lines.push('- Dossier: `' + data.dossier.id + '`');
    lines.push('- Index: `' + path + '/index.html`');
    lines.push('- Source: `' + path + '/' + roundFile + '`');
    lines.push('- Source round: `' + String(data.round.number).padStart(2, '0') + '`');
    lines.push('- Intent: `' + result.intent + '`');
    lines.push('');
    lines.push('## ' + ui.decisionsHeading);
    lines.push('');
    data.round.decisions.forEach(function (decision) {
      var prefix = 'decision.' + decision.id;
      var disposition = result.state[prefix + '.disposition'];
      var selected = result.state[prefix + '.option'] || [];
      if (!Array.isArray(selected)) selected = selected ? [selected] : [];
      lines.push('- `' + decision.id + '` — ' + disposition + (selected.length ? ' → `' + selected.join('`, `') + '`' : ''));
      bulletNote(lines, (result.state[prefix + '.note'] || '').trim());
    });
    lines.push('');
    lines.push('## ' + ui.threadsHeading);
    lines.push('');
    var openThreads = data.round.threads.filter(function (thread) { return thread.status === 'open'; });
    if (!openThreads.length) lines.push('- ' + ui.none);
    openThreads.forEach(function (thread) {
      var prefix = 'thread.' + thread.id;
      lines.push('- `' + thread.id + '` — ' + result.state[prefix + '.disposition']);
      bulletNote(lines, (result.state[prefix + '.note'] || '').trim());
    });
    var globalNotes = (result.state.globalNotes || '').trim();
    if (globalNotes) {
      lines.push('');
      lines.push('## ' + ui.correctionsHeading);
      lines.push('');
      globalNotes.split(/\r?\n/).forEach(function (line) { if (line.trim()) lines.push('- ' + line.trim()); });
    }
    return lines.join('\n');
  }

  function fallbackCopy(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); } finally { document.body.removeChild(area); }
  }

  function writeClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    fallbackCopy(text);
    return Promise.resolve();
  }

  form.addEventListener('input', function () {
    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(save, 180);
    validate(false);
  });
  form.addEventListener('change', function () { save(); validate(false); });

  copyButton.addEventListener('click', function () {
    var result = validate(true);
    if (!result.valid) {
      status.textContent = ui.fixFields;
      var first = form.querySelector('[aria-invalid="true"]');
      if (first) first.focus();
      return;
    }
    writeClipboard(buildMarkdown(result)).then(function () {
      copyButton.textContent = ui.copied;
      copyButton.dataset.state = 'copied';
      status.textContent = ui.copiedStatus;
      window.clearTimeout(copyTimer);
      copyTimer = window.setTimeout(function () {
        copyButton.textContent = data.round.kind === 'final' ? ui.copyHandoff : ui.copyMarkdown;
        delete copyButton.dataset.state;
      }, 1800);
    }, function () { status.textContent = ui.copyFailed; });
  });

  resetButton.addEventListener('click', function () {
    form.reset();
    try { localStorage.removeItem(storageKey); } catch (_) {}
    status.textContent = ui.resetStatus;
    validate(false);
  });

  restore();
  validate(false);
}());
</script>
</body>
</html>
